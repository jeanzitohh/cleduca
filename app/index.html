<!DOCTYPE html>
<html lang="es" data-theme="selva" data-dark="false">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="description" content="Cleduca — App educativa interactiva para niños colombianos. Aprende jugando con Cleo, tu mascota husky. Matemáticas, Lenguaje, Ciencias y más.">
  <meta name="theme-color" content="#FAF9F6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Cleduca">
  <link rel="icon" href="../img/Logo_cleduca_transparente.png">
  <title>Cleduca — Aprende Jugando 🐶</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="../css/themes.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/style.css">

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4702701194736185" crossorigin="anonymous"></script>

  <!-- Supabase & Real-Time Traffic Tracker -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
  (function initAppTrafficTracker() {
    try {
      const SUPABASE_URL = 'https://tmbvwsauzngvydldjuqe.supabase.co';
      const SUPABASE_KEY = 'sb_publishable_fE32RmyeRXacyyQx9PyZvA_PIC45T8g';
      const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
      if (!sb) return;

      window.supabase_client = sb;
      const pageName = 'Web App Cleduca';
      let sessionId = localStorage.getItem('cleduca_sid');
      if (!sessionId) {
        sessionId = 'sid_' + Math.random().toString(36).substr(2, 9);
        localStorage.setItem('cleduca_sid', sessionId);
      }

      const channel = sb.channel('cleduca-traffic-channel', {
        config: { presence: { key: sessionId } }
      });

      channel.subscribe(async (status) => {
        if (status === 'SUBSCRIBED') {
          await channel.track({
            page: pageName,
            url: window.location.href,
            timestamp: new Date().toISOString()
          });
        }
      });
    } catch(e) {}
  })();
  </script>
</head>
<body>

<!-- App Shell -->
<div id="app">

  <!-- ═══ SPLASH ═══ -->
  <div id="view-splash" class="view active" style="padding-bottom:0;">
    <div style="min-height:100dvh;background:var(--grad-hero);display:flex;flex-direction:column;
         align-items:center;justify-content:center;gap:20px;padding:40px 24px;position:relative;overflow:hidden;">
      <!-- Decorative clouds -->
      <div style="position:absolute;top:30px;left:-20px;width:120px;height:60px;
           background:rgba(255,255,255,0.25);border-radius:50px;animation:float 6s ease-in-out infinite;"></div>
      <div style="position:absolute;top:60px;right:-10px;width:90px;height:45px;
           background:rgba(255,255,255,0.2);border-radius:50px;animation:float 5s ease-in-out infinite 1s;"></div>
      <div style="position:absolute;bottom:100px;left:10px;width:70px;height:35px;
           background:rgba(255,255,255,0.15);border-radius:50px;animation:float 7s ease-in-out infinite 0.5s;"></div>

      <!-- Cleo mascot -->
      <div id="splash-cleo" class="animate-bounceIn" style="width:180px;height:180px;border-radius:50%;overflow:hidden;box-shadow:0 8px 32px rgba(0,0,0,0.15);background:rgba(255,255,255,0.15);display:flex;align-items:center;justify-content:center;animation:floatBig 4s ease-in-out infinite;padding:8px;">
        <img src="/img/Logo_cleduca_transparente.png" alt="Cleo" style="width:100%;height:100%;object-fit:contain;" onerror="this.src='/img/Logo_cleduca_transparente.svg'">
      </div>

      <!-- Logo -->
      <div class="animate-fadeInUp delay-300" style="text-align:center;">
        <div style="font-family:'Plus Jakarta Sans',sans-serif;font-weight:900;font-size:3.2rem;
             color:#fff;letter-spacing:-1px;text-shadow:0 4px 20px rgba(0,0,0,0.2);">Cleduca</div>
        <div style="color:rgba(255,255,255,0.9);font-weight:600;font-size:1.05rem;margin-top:4px;">
          ¡Aprende jugando con Cleo! 🌟
        </div>
      </div>

      <!-- CTA Button -->
      <div class="animate-fadeInUp delay-500" style="width:100%;max-width:300px;">
        <button class="btn btn-full btn-lg" id="splash-btn"
                style="background:#fff;color:var(--c-primary);font-size:1.2rem;letter-spacing:0.5px;
                       box-shadow:0 8px 32px rgba(0,0,0,0.2);border-radius:20px;margin-top:8px;"
                onclick="startApp()">
          ¡EMPEZAR! 🚀
        </button>
      </div>

      <!-- Bottom tagline -->
      <div class="animate-fadeInUp delay-700" style="color:rgba(255,255,255,0.7);font-size:0.8rem;text-align:center;">
        Educación interactiva para Colombia 🇨🇴
      </div>
    </div>
  </div>

  <!-- ═══ LOGIN / REGISTER ═══ -->
  <div id="view-login" class="view" style="padding-bottom:0;"></div>

  <!-- ═══ PROFILES ═══ -->
  <div id="view-profiles" class="view" style="padding-bottom:0;"></div>

  <!-- ═══ AUTH / CREATE PROFILE ═══ -->
  <div id="view-auth" class="view" style="padding-bottom:0;"></div>

  <!-- ═══ GRADE SELECTOR ═══ -->
  <div id="view-grade" class="view" style="padding-bottom:0;"></div>

  <!-- ═══ HOME ═══ -->
  <div id="view-home" class="view"></div>

  <!-- ═══ MATERIAS ═══ -->
  <div id="view-materias" class="view"></div>

  <!-- ═══ SUBJECT DETAIL ═══ -->
  <div id="view-subject" class="view"></div>

  <!-- ═══ IDIOMAS ═══ -->
  <div id="view-idiomas" class="view"></div>

  <!-- ═══ JUEGOS ═══ -->
  <div id="view-juegos" class="view"></div>

  <!-- ═══ LOGROS ═══ -->
  <div id="view-logros" class="view"></div>

  <!-- ═══ PERFIL ═══ -->
  <div id="view-perfil" class="view"></div>

  <!-- ═══ GAME ENGINE ═══ -->
  <div id="view-game" class="view" style="padding-bottom:0;"></div>

  <!-- ═══ BOTTOM NAVIGATION ═══ -->
  <nav class="bottom-nav" id="bottom-nav" style="display:none;">
    <button class="nav-item active" id="nav-home" onclick="CleoRouter.navigate('home')">
      <span class="nav-icon">🏠</span>
      <span>Inicio</span>
    </button>
    <button class="nav-item" id="nav-materias" onclick="CleoRouter.navigate('materias')">
      <span class="nav-icon">📚</span>
      <span>Materias</span>
    </button>

    <!-- FAB Central -->
    <div class="nav-fab-container">
      <button class="nav-fab" id="nav-fab" onclick="CleoRouter.fabAction()">
        <span class="fab-icon">🎮</span>
        <span class="fab-label">Jugar</span>
      </button>
    </div>

    <button class="nav-item" id="nav-logros" onclick="CleoRouter.navigate('logros')">
      <span class="nav-icon">🏆</span>
      <span>Logros</span>
    </button>
    <button class="nav-item" id="nav-perfil" onclick="CleoRouter.navigate('perfil')">
      <span class="nav-icon">👤</span>
      <span>Perfil</span>
    </button>
  </nav>

</div><!-- /app -->

<!-- Toast container (global) -->
<div id="toast-container" class="toast-container"></div>

<!-- Supabase SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Scripts (order matters) -->
<script src="../js/data/content.js"></script>
<script src="../js/wompi.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/games.js"></script>
<script src="../js/games_expansion1.js"></script>
<script src="../js/games_expansion2.js"></script>
<script src="../js/app.js"></script>

<script>
// ── INIT ──
function startApp() {
  document.getElementById('view-splash').style.display = 'none';
  if (window.CleoAuth && CleoAuth.isUserLoggedIn()) {
    showProfiles();
  } else {
    if (typeof showAuthScreen === 'function') {
      showAuthScreen();
    } else {
      showProfiles();
    }
  }
}

function requestNotifications() {
  if ('Notification' in window && Notification.permission === 'default') {
    Notification.requestPermission();
  }
}

function scheduleNotification() {
  if ('serviceWorker' in navigator && 'Notification' in window && Notification.permission === 'granted') {
    const profile = CleoAuth.getActive();
    if (!profile) return;
    const lastStudy = profile.lastStudy;
    const today = new Date().toDateString();
    if (!lastStudy || new Date(lastStudy).toDateString() !== today) {
      new Notification('🐶 ¡Cleo te está esperando!', {
        body: 'Es hora de aprender. ¡Tu racha te necesita!',
        icon: '../img/Logo_cleduca_transparente.png'
      });
    }
  }
}

function applySavedSettings() {
  const profile = CleoAuth.getActive();
  if (profile) {
    document.documentElement.setAttribute('data-theme', profile.theme || 'selva');
    document.documentElement.setAttribute('data-dark', profile.darkMode || false);
  }
}

document.addEventListener('click', function(e) {
  const btn = e.target.closest('.btn, .option-btn, .grade-card, .game-card, .profile-card');
  if (btn && !btn.disabled) {
    CleoAnimations.ripple(btn, e);
  }
});

window.addEventListener('popstate', function() {
  const active = document.querySelector('.view.active');
  if (active && active.id !== 'view-home' && active.id !== 'view-splash') {
    CleoRouter.navigate('home');
  }
});

document.addEventListener('DOMContentLoaded', () => {
  applySavedSettings();
  requestNotifications();

  document.getElementById('splash-cleo')?.addEventListener('click', () => {
    CleoSpeech.say('¡Hola! Soy Cleo, tu compañera de aprendizaje. ¡Toca Empezar para comenzar!', 0.9, 1.3);
  });

  setTimeout(scheduleNotification, 5000);

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('../sw.js').catch(console.warn);
  }
});
</script>
</body>
</html>
